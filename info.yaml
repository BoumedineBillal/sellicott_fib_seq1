# Tiny Tapeout project information
project:
  title:        "16-bit RISC-V Core"           # Project title
  author:       "Your Name"                  # Your name
  discord:      "your_discord"               # Your discord username (optional)
  description:  "16-bit RISC-V processor with 16 registers, 32-word instruction memory (2x2 tile)" # One line description
  language:     "Verilog"                    # Language used

  clock_hz:     50000000                     # Clock frequency in Hz (50 MHz)
  tiles:        "3x2"                        # Tile size (6x area for maximum design space)

  top_module:   "tt_um_riscv_core"           # Top module name (must start with tt_um_)

  source_files:
    - "tt_um_riscv_core.v"                   # Top-level Tiny Tapeout wrapper
    - "riscv_core.v"                         # Tiny RISC-V core

pinout:
  # Inputs (ui_in)
  ui[0]: "data[0]"          # Instruction data or mode bits
  ui[1]: "data[1]"
  ui[2]: "data[2]"
  ui[3]: "data[3]"
  ui[4]: "data[4]"
  ui[5]: "data[5]"
  ui[6]: "mode[0]"          # 00=Run, 01=Load low, 10=Load high
  ui[7]: "mode[1]"

  # Outputs (uo_out) - Multiplexed PC or ALU result
  uo[0]: "output[0]"
  uo[1]: "output[1]"
  uo[2]: "output[2]"
  uo[3]: "output[3]"
  uo[4]: "output[4]"
  uo[5]: "output[5]"
  uo[6]: "output[6]"
  uo[7]: "output[7]"

  # Bidirectional pins (uio)
  uio[0]: "out_sel[0]"      # Output select (input)
  uio[1]: "out_sel[1]"      # 00=PC low, 01=PC high, 10=ALU low, 11=ALU high
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: "halted"          # Halt flag (output)

yaml_version: 6
