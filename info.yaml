# Tiny Tapeout project information
project:
  title:        "Tiny 8-bit RISC-V Core"      # Project title
  author:       "Your Name"                  # Your name
  discord:      "your_discord"               # Your discord username (optional)
  description:  "Minimal 8-bit RISC-V-inspired processor with 8 registers and 4 operations" # One line description
  language:     "Verilog"                    # Language used

  clock_hz:     50000000                     # Clock frequency in Hz (50 MHz)
  tiles:        "1x1"                        # Tile size

  top_module:   "tt_um_riscv_core"           # Top module name (must start with tt_um_)

  source_files:
    - "tt_um_riscv_core.v"                   # Top-level Tiny Tapeout wrapper
    - "riscv_core.v"                         # Tiny RISC-V core

pinout:
  # Inputs (ui_in) - 8-bit instruction format
  ui[0]: "rs[0]"            # Source register (bits 2:0)
  ui[1]: "rs[1]"
  ui[2]: "rs[2]"
  ui[3]: "rd[0]"            # Destination register (bits 5:3)
  ui[4]: "rd[1]"
  ui[5]: "rd[2]"
  ui[6]: "opcode[0]"        # Operation: 00=ADD, 01=SUB, 10=AND, 11=OR
  ui[7]: "opcode[1]"

  # Outputs (uo_out) - ALU result
  uo[0]: "result[0]"
  uo[1]: "result[1]"
  uo[2]: "result[2]"
  uo[3]: "result[3]"
  uo[4]: "result[4]"
  uo[5]: "result[5]"
  uo[6]: "result[6]"
  uo[7]: "result[7]"

  # Bidirectional pins (uio) - Status output
  uio[0]: "pc[0]"           # Program counter
  uio[1]: "pc[1]"
  uio[2]: "pc[2]"
  uio[3]: ""                # Unused
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

yaml_version: 6
