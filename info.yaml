# Tiny Tapeout project information
project:
  title:        "Simple 32-bit RISC-V Core"  # Project title
  author:       "Your Name"                  # Your name
  discord:      "your_discord"               # Your discord username (optional)
  description:  "A simple 32-bit RISC-V core implementing RV32I instruction subset" # One line description
  language:     "Verilog"                    # Language used

  clock_hz:     50000000                     # Clock frequency in Hz (50 MHz)
  tiles:        "1x1"                        # Tile size

  top_module:   "tt_um_riscv_core"           # Top module name (must start with tt_um_)

  source_files:
    - "tt_um_riscv_core.v"                   # Top-level Tiny Tapeout wrapper
    - "riscv_core.v"                         # RISC-V core implementation
    - "riscv_alu.v"                          # ALU module
    - "riscv_regfile.v"                      # Register file module

pinout:
  # Inputs (ui_in)
  ui[0]: "data/addr[0]"     # Mode-dependent data/address input
  ui[1]: "data/addr[1]"
  ui[2]: "data/addr[2]"
  ui[3]: "data/addr[3]"
  ui[4]: "data/addr[4]"
  ui[5]: "data/addr[5]"
  ui[6]: "mode[0]"          # Mode select: 00=Run, 01=Load byte0, 10=Load byte1, 11=Load byte2-3
  ui[7]: "mode[1]"

  # Outputs (uo_out)
  uo[0]: "output[0]"        # Multiplexed output (PC or ALU result)
  uo[1]: "output[1]"
  uo[2]: "output[2]"
  uo[3]: "output[3]"
  uo[4]: "output[4]"
  uo[5]: "output[5]"
  uo[6]: "output[6]"
  uo[7]: "output[7]"

  # Bidirectional pins (uio)
  uio[0]: "out_sel[0]"      # Output select bits (input mode)
  uio[1]: "out_sel[1]"      # Output select bits (input mode)
  uio[2]: "rd_addr[0]"      # Destination register address (output mode)
  uio[3]: "rd_addr[1]"
  uio[4]: "rd_addr[2]"
  uio[5]: "rd_addr[3]"
  uio[6]: "rd_addr[4]"
  uio[7]: "halted"          # Halt flag (output mode)

yaml_version: 6
